# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.0"
  python_check_max: "3.15"

package:
  name: mypy_extensions
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mypy-extensions/mypy_extensions-${{ version }}.tar.gz
  sha256: c6e275a07f1c2fc096b62940452d0eaa3f3af7de45d704787866240a7c6d5a51

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --check-build-dependencies

requirements:
  host:
    - flit-core >=3.11,<5
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - mypy_extensions/**
        - mypy_extensions-${{ version }}.dist-info/**
  - python:
      imports: mypy_extensions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  license: MIT
  license_file: LICENSE
  summary: Type system extensions for programs checked with the mypy type checker.
  description: |
    The 'mypy_extensions' module defines experimental extensions to the
    standard 'typing' module that are supported by the mypy typechecker.
  homepage: https://pypi.org/project/mypy-extensions
  repository: https://github.com/python/mypy_extensions

extra:
  recipe-maintainers:
    - nehaljwani
    - ocefpaf
    - conda-forge/mypy
